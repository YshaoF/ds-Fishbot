name: Build Fishbot iOS (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main, codex/ios-mobile]
    paths: ['dist/**', 'ios/**', 'scripts/**', 'tests/**', '.github/workflows/build-ios.yml']
permissions:
  contents: read
concurrency:
  group: fishbot-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: python3 scripts/prepare-ios.py
  build:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bundled assets and project
        run: python3 scripts/prepare-ios.py
      - name: Validate plist and show Xcode
        run: |
          xcodebuild -version
          plutil -lint ios/Fishbot/Info.plist ios/Fishbot/PrivacyInfo.xcprivacy ios/Fishbot.xcodeproj/project.pbxproj
          xcodebuild -list -project ios/Fishbot.xcodeproj
      - name: Compile for iOS Simulator
        run: xcodebuild -project ios/Fishbot.xcodeproj -scheme Fishbot -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Launch in simulator and capture first screen
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/simulator/Build/Products/Debug-iphonesimulator/Fishbot.app
          xcrun simctl launch "$UDID" com.fishbot.assistant.ios
          sleep 6
          xcrun simctl io "$UDID" screenshot build/Fishbot-Simulator.png
      - name: Archive ARM64 device app without signing
        run: xcodebuild -project ios/Fishbot.xcodeproj -scheme Fishbot -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Fishbot.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package IPA for personal signing on Windows
        run: |
          mkdir -p build/package/Payload
          cp -R build/Fishbot.xcarchive/Products/Applications/Fishbot.app build/package/Payload/
          cd build/package
          ditto -c -k --sequesterRsrc --keepParent Payload Fishbot-unsigned.ipa
          shasum -a 256 Fishbot-unsigned.ipa > Fishbot-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Fishbot-iOS-personal-signing
          path: |
            build/package/Fishbot-unsigned.ipa
            build/package/Fishbot-unsigned.ipa.sha256
            build/Fishbot-Simulator.png
          retention-days: 3
          if-no-files-found: error
